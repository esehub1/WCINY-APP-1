// Top-level build file where you can add configuration options common to all sub-projects/modules.
//file:noinspection GrDeprecatedAPIUsage
//file:noinspection GrDeprecatedAPIUsage

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.1'
        classpath 'com.google.gms:google-services:4.4.2'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

// Ensure plugin version fallbacks are available for plugins that read them from root ext
ext.ANDROID_FCM_VERSION = ext.has('ANDROID_FCM_VERSION') ? ext.ANDROID_FCM_VERSION : '21.0.0'
ext.ANDROID_FIREBASE_BOM_VERSION = ext.has('ANDROID_FIREBASE_BOM_VERSION') ? ext.ANDROID_FIREBASE_BOM_VERSION : '26.0.0'

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
