def PLUGIN_CONFIG = new Object()
try {
    PLUGIN_CONFIG = new groovy.json.JsonSlurper().parseText(file("${projectDir}/../../../package.json").text).cordova.plugins['cordova-plugin-fcm-with-dependecy-updated']
} catch(Exception e) {}
def ANDROID_FCM_VERSION = System.getenv('ANDROID_FCM_VERSION') ?: rootProject.hasProperty('ANDROID_FCM_VERSION') ? rootProject.ext.ANDROID_FCM_VERSION : PLUGIN_CONFIG.hasProperty("ANDROID_FCM_VERSION") ? PLUGIN_CONFIG.ANDROID_FCM_VERSION : null ?: '19.0.0'

buildscript {
    ext {
        def PLUGIN_CONFIG = new Object()
        try {
            PLUGIN_CONFIG = new groovy.json.JsonSlurper().parseText(file("${projectDir}/../../../package.json").text).cordova.plugins['cordova-plugin-fcm-with-dependecy-updated']
        } catch(Exception e) {
            def WARNING_STYLE = "${(char)27}[33;49"+"m"
            def DEFAULT_STYLE = "${(char)27}[39;49"+"m"
            print(WARNING_STYLE+"FCMPlugin: Plugin install variables are not accessible, as package.json was unreachable/unreadable."+DEFAULT_STYLE)
        }
        // Resolve versions: environment -> rootProject ext -> plugin config -> safe default
        ANDROID_GRADLE_TOOLS_VERSION = System.getenv('ANDROID_GRADLE_TOOLS_VERSION') ?: (rootProject.hasProperty('ANDROID_GRADLE_TOOLS_VERSION') ? rootProject.ext.ANDROID_GRADLE_TOOLS_VERSION : (PLUGIN_CONFIG?.hasProperty("ANDROID_GRADLE_TOOLS_VERSION") ? PLUGIN_CONFIG.ANDROID_GRADLE_TOOLS_VERSION : null)) ?: '8.0.2'
        ANDROID_GOOGLE_SERVICES_VERSION = System.getenv('ANDROID_GOOGLE_SERVICES_VERSION') ?: (rootProject.hasProperty('ANDROID_GOOGLE_SERVICES_VERSION') ? rootProject.ext.ANDROID_GOOGLE_SERVICES_VERSION : (PLUGIN_CONFIG?.hasProperty("ANDROID_GOOGLE_SERVICES_VERSION") ? PLUGIN_CONFIG.ANDROID_GOOGLE_SERVICES_VERSION : null)) ?: '4.4.0'

        // Parse a numeric major.minor float from the AGP version string safely (e.g. "8.0.2" -> 8.0f)
        try {
            def gradVerStr = '8.0'
            if (ANDROID_GRADLE_TOOLS_VERSION && ANDROID_GRADLE_TOOLS_VERSION.indexOf('.') > -1) {
                def parts = ANDROID_GRADLE_TOOLS_VERSION.tokenize('.')
                if (parts.size() >= 2) {
                    gradVerStr = parts[0] + '.' + parts[1]
                } else {
                    gradVerStr = ANDROID_GRADLE_TOOLS_VERSION
                }
            } else if (ANDROID_GRADLE_TOOLS_VERSION) {
                gradVerStr = ANDROID_GRADLE_TOOLS_VERSION
            }
            ext.gradleNumberVersion = gradVerStr.toFloat()
        } catch(Exception e) {
            // Fallback to a safe numeric value if parsing fails
            ext.gradleNumberVersion = 8.0f
        }
    }
    repositories {
        mavenCentral()
        jcenter()
        mavenLocal()
        if (gradleNumberVersion >= 3.4f) {
            google()
        }
    }
    dependencies {
        /**
         * PS: Avoid use "GRADLE_VERSION" because jitpack
         * set this like a environment variable
         */
        classpath "com.android.tools.build:gradle:${ANDROID_GRADLE_TOOLS_VERSION}"

        /**
         * Reference: https://github.com/google/play-services-plugins/issues/22
         *
         * PS: 4.2.0 throws a NullPointerException when use gradle plugin
         *     com.google.gms.googleservices.GoogleServicesPlugin class reference
         *     instead of id(string)
         */

        classpath "com.google.gms:google-services:${ANDROID_GOOGLE_SERVICES_VERSION}"
    }
}
repositories {
    mavenCentral()
    jcenter()
    if (gradleNumberVersion >= 3.4f) {
        google()
    }
}
dependencies {
    if (gradleNumberVersion >= 3.4f) {
        implementation "com.google.firebase:firebase-messaging:${ANDROID_FCM_VERSION}"
    } else {
        compile "com.google.firebase:firebase-messaging:${ANDROID_FCM_VERSION}"
    }
}
// apply plugin: 'com.google.gms.google-services'
// class must be used instead of id(string) to be able to apply plugin from non-root gradle file
if (!project.plugins.hasPlugin('com.google.gms.google-services')) {
    apply plugin: com.google.gms.googleservices.GoogleServicesPlugin
}
